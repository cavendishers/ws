<!-- Markdown解析器和XSS防护库 -->
<script src="https://cdn.jsdelivr.net/npm/marked@5.1.1/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.3/dist/purify.min.js"></script>

<!-- AI聊天小部件CSS -->

<!-- Markdown内容样式增强 -->
<style>
/* Markdown内容样式 - 兼容TailwindCSS */
.markdown-content {
    line-height: 1.6;
    word-wrap: break-word;
    color: inherit; /* 继承父元素的文字颜色 */
}

/* 消息操作按钮样式修复 */
.message-hover-actions {
    position: absolute;
    top: -8px;
    right: -8px;
    display: none;
    flex-direction: row;
    gap: 4px;
    background: transparent;
    border-radius: 8px;
    padding: 4px;
    backdrop-filter: blur(8px);
    border: 0px solid rgba(255, 255, 255, 0.1);
    z-index: 10;
}

/* 用户消息容器需要相对定位才能让绝对定位的按钮正确显示 */
.chat-message-user {
    position: relative;
}

.chat-message-ai {
    position: relative;
}

/* 悬停时显示操作按钮 */
.chat-message-user:hover .message-hover-actions,
.chat-message-ai:hover .message-hover-actions {
    display: flex;
}

/* 操作按钮样式 */
.message-action-btn {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.1);
    color: rgba(255, 255, 255, 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    padding: 0;
}

.message-action-btn:hover {
    background: rgba(255, 255, 255, 0.2);
    color: white;
    border-color: rgba(255, 255, 255, 0.4);
    transform: scale(1.05);
}

.message-action-btn svg {
    width: 14px;
    height: 14px;
}

/* 确保聊天消息容器的文字颜色正确 */
.chat-message-ai .markdown-content {
    color: var(--text-primary); /* AI消息使用主要文字颜色 */
}

.chat-message-user .markdown-content {
    color: white; /* 用户消息使用白色文字 */
}

.markdown-content h1, .markdown-content h2, .markdown-content h3, 
.markdown-content h4, .markdown-content h5, .markdown-content h6 {
    font-weight: 600;
    margin: 0.75em 0 0.5em 0;
    color: inherit; /* 继承父元素颜色，保持一致性 */
}

.markdown-content h1 { font-size: 1.5em; }
.markdown-content h2 { font-size: 1.3em; }
.markdown-content h3 { font-size: 1.2em; }
.markdown-content h4 { font-size: 1.1em; }

.markdown-content p {
    margin: 0.5em 0;
    line-height: 1.6;
    color: inherit; /* 继承父元素文字颜色 */
}

.markdown-content strong {
    font-weight: 600;
    color: inherit; /* 继承父元素颜色，但保持粗体 */
}

.markdown-content em {
    font-style: italic;
    color: inherit; /* 继承父元素颜色，但保持斜体 */
    opacity: 0.9; /* 稍微降低透明度以区分 */
}

.markdown-content ul, .markdown-content ol {
    margin: 0.5em 0;
    padding-left: 1.5em;
}

.markdown-content li {
    margin: 0.25em 0;
    line-height: 1.5;
    color: inherit; /* 继承父元素文字颜色 */
}

.markdown-content ul li {
    list-style-type: disc;
}

.markdown-content ol li {
    list-style-type: decimal;
}

.markdown-content code {
    background: rgba(0, 191, 255, 0.1);
    color: var(--button-highlight);
    padding: 0.2em 0.4em;
    border-radius: 3px;
    font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
    font-size: 0.9em;
    border: 1px solid rgba(0, 191, 255, 0.15);
}

.markdown-content pre {
    background: rgba(0, 0, 0, 0.05);
    border: 1px solid rgba(0, 191, 255, 0.15);
    border-radius: 6px;
    padding: 1em;
    margin: 0.75em 0;
    overflow-x: auto;
    font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
    font-size: 0.9em;
    line-height: 1.4;
}

.markdown-content pre code {
    background: transparent;
    border: none;
    padding: 0;
    color: inherit; /* 继承父元素颜色 */
}

.markdown-content blockquote {
    border-left: 4px solid var(--button-highlight);
    margin: 0.75em 0;
    padding: 0.5em 1em;
    background: rgba(0, 191, 255, 0.05);
    font-style: italic;
    color: inherit; /* 继承父元素颜色 */
    opacity: 0.85; /* 稍微降低透明度以区分引用 */
}

.markdown-content table {
    border-collapse: collapse;
    width: 100%;
    margin: 0.75em 0;
    font-size: 0.9em;
    border: 1px solid rgba(0, 191, 255, 0.2);
    border-radius: 6px;
    overflow: hidden;
}

.markdown-content th, .markdown-content td {
    border: 1px solid rgba(0, 191, 255, 0.15);
    padding: 0.5em 0.75em;
    text-align: left;
}

.markdown-content th {
    background: rgba(0, 191, 255, 0.1);
    font-weight: 600;
    color: inherit; /* 继承父元素颜色 */
}

.markdown-content td {
    background: rgba(255, 255, 255, 0.02);
}

.markdown-content tr:nth-child(even) td {
    background: rgba(0, 191, 255, 0.03);
}

.markdown-content a {
    color: var(--button-highlight);
    text-decoration: underline;
    text-decoration-color: rgba(0, 191, 255, 0.5);
}

.markdown-content a:hover {
    text-decoration-color: var(--button-highlight);
}

.markdown-content hr {
    border: none;
    height: 1px;
    background: rgba(0, 191, 255, 0.2);
    margin: 1em 0;
}

/* 代码块滚动条样式 */
.markdown-content pre::-webkit-scrollbar {
    height: 6px;
}

.markdown-content pre::-webkit-scrollbar-track {
    background: rgba(0, 191, 255, 0.1);
    border-radius: 3px;
}

.markdown-content pre::-webkit-scrollbar-thumb {
    background: rgba(0, 191, 255, 0.3);
    border-radius: 3px;
}

.markdown-content pre::-webkit-scrollbar-thumb:hover {
    background: rgba(0, 191, 255, 0.5);
}
</style>

<!-- 确保CSRF token可用 -->
